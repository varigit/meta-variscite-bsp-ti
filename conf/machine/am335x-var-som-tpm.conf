#@TYPE: Machine
#@NAME: Variscite VAR-SOM-AM33 TPM
#@DESCRIPTION: Machine configuration for the Variscite VAR-SOM-AM33 EVK
#@DESCRIPTION: with TPM
#@MAINTAINER: Yair Ben Avraham <yair.b@variscite.com>

# Inherit base VAR-SOM-AM33 machine settings.
require conf/machine/am335x-var-som.conf

# Keep compatibility with existing am335x-var-som overrides used in recipes.
MACHINEOVERRIDES =. "am335x-var-som:"

KERNEL_DEVICETREE += "var-som-am33-tpm.dtb"
IMAGE_BOOT_FILES = " \
    ${SPL_BINARY} \
    u-boot.${UBOOT_SUFFIX} \
    extlinux.conf;extlinux/extlinux.conf \
    ${KERNEL_IMAGETYPE} \
    var-som-am33-tpm.dtb;var-som-am33.dtb \
"

# TPM2 userspace stack for VAR-SOM-AM33 with TPM.
IMAGE_INSTALL_append = " packagegroup-security-tpm2"

# Drop the default Variscite connectivity package group to remove
# Wi-Fi/Bluetooth userspace packages from this TPM image variant.
IMAGE_INSTALL_remove = " packagegroup-var-connectivity"

MKUBIFS_ARGS:am335x-var-som-tpm = "-F -m 2048 -e 126976 -c 4700"
