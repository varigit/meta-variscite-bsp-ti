#@TYPE: Machine
#@NAME: Variscite VAR-SOM-AM62
#@DESCRIPTION: Machine configuration for the Variscite VAR-SOM-AM62 EVK
#@MAINTAINER: Nate Drude <nate.d@variscite.com>

MACHINEOVERRIDES =. "am62xx:"
require conf/machine/include/am62xx.inc
require variscite.inc
require variscite_bcm43xx.inc

MACHINE_FEATURES += "gpu bootloader-splash"

KERNEL_DEVICETREE = " \
    ti/k3-am625-var-som-symphony.dtb \
"

FIT_CONF_DEFAULT_DTB = "k3-am625-var-som-symphony.dtb"

KERNEL_IMAGETYPES = "Image fitImage"

SPL_BINARY = "tispl.bin"
UBOOT_BINARY = "u-boot.img"
UBOOT_SYMLINK = "u-boot.img"
UBOOT_MACHINE = "am62x_var_som_a53_defconfig"

WKS_FILE = "var-sdimage-2part.wks"

# We have to disable SERIAL_CONSOLE due to auto-serial-console
SERIAL_CONSOLES = "115200;ttyS0"

# Enable virtualization
DISTRO_FEATURES:append = " virtualization"

# Remove default TI boot files
IMAGE_BOOT_FILES:remove = " \
    tiboot3-am62x-hs-fs-evm.bin \
    tiboot3-am62x-gp-evm.bin \
    tiboot3-am62x-hs-evm.bin \
"

# and replace with Variscite versions
IMAGE_BOOT_FILES:append = " \
    tiboot3-am62x-hs-fs-${MACHINE}.bin \
    tiboot3-am62x-gp-${MACHINE}.bin \
    tiboot3-am62x-hs-${MACHINE}.bin \
"

IMAGE_BOOT_FILES:remove = "ti_logo_414x97_32bpp.bmp.gz"

BBMASK += "meta-variscite-bsp-ti/recipes-ti/ti-rtos-bin/ti-rtos-firmware.bbappend"

# Include Common Mender configuration when meta-mender is in BBFILE_COLLECTIONS
require ${@bb.utils.contains('BBFILE_COLLECTIONS', 'mender', 'include/variscite-mender.inc', '', d)}

# Explicit WKS layout controls on-disk layout; MENDER_STORAGE_TOTAL_SIZE_MB is still
# needed by do_image_mender's size sanity checks even when WIC is explicit.
MENDER_STORAGE_TOTAL_SIZE_MB ?= "7400"
MENDER_BOOT_PART_SIZE_MB = "40"

BOOTENV_SIZE="0x40000"
# 0x2B00000 (43 MB)
MENDER_UBOOT_ENV_STORAGE_DEVICE_OFFSET = "45088768"
# 0x0040000 (256 KB)
MENDER_PARTITION_ALIGNMENT = "262144"
